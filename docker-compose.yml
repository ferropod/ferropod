services:
  ferropod:
    build: .
    container_name: ferropod
    restart: unless-stopped
    environment:
      FERROPOD_PROFILE: ${FERROPOD_PROFILE:-low-mem}
      FERROPOD_BIND: ${FERROPOD_BIND:-0.0.0.0:80}
      # Optional: enable native HTTPS (default 0.0.0.0:443 when ACME or TLS cert/key is set)
      # FERROPOD_HTTPS_BIND: 0.0.0.0:443
      # FERROPOD_ACME_DOMAINS: panel.example.com,app.example.com
      # FERROPOD_ACME_EMAIL: ops@example.com
      # FERROPOD_HTTP_REDIRECT_HTTPS: "true"
      # Or manual PEM certificates instead of ACME:
      # FERROPOD_TLS_CERT: /data/certs/fullchain.pem
      # FERROPOD_TLS_KEY: /data/certs/privkey.pem
      FERROPOD_DATA_DIR: /data
      FERROPOD_MASTER_KEY: ${FERROPOD_MASTER_KEY:-change-this-strong-master-key}
    ports:
      - "${FERROPOD_HTTP_PORT:-80}:80"
      - "${FERROPOD_HTTPS_PORT:-443}:443"
    volumes:
      - ./data:/data
