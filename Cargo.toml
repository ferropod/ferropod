[package]
name = "ferropod"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "AI-Native lightweight self-hosted PaaS in Pure Rust (Wasmtime + Turso MVCC + Blob + Queue + KV + MCP)"
homepage = "https://ferropod.github.io"
repository = "https://github.com/ferropod/ferropod"
readme = "README.md"
keywords = ["paas", "self-hosted", "wasm", "turso", "mcp"]
categories = ["web-programming::http-server", "command-line-utilities"]

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "limit", "compression-gzip"] }
turso = { version = "0.8", default-features = false, features = ["mimalloc"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aes-gcm = "0.10"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
bytes = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
tokio-stream = { version = "0.1", features = ["sync"] }
mime_guess = "2"
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-acme = { version = "0.15", default-features = false, features = ["ring", "tls12", "webpki-roots", "axum"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "json"] }
flate2 = "1"
tar = "0.4"

[dev-dependencies]
tempfile = "3"
http-body-util = "0.1"
rcgen = "0.14"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
